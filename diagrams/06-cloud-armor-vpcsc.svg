<svg width="900" height="380" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="380" fill="#FFFFFF"/>
  <text x="450" y="40" font-size="20" font-weight="bold" fill="#16224F" text-anchor="middle">Two directions, two different guards</text>

  <!-- center resource -->
  <rect x="380" y="150" width="140" height="90" rx="14" fill="#16224F"/>
  <text x="450" y="190" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Your</text>
  <text x="450" y="208" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">resources</text>

  <!-- front door: Cloud Armor -->
  <rect x="60" y="150" width="230" height="90" rx="14" fill="#E8F0FE" stroke="#4285F4" stroke-width="2"/>
  <text x="175" y="185" font-size="14" fill="#1B3A8C" text-anchor="middle" font-weight="bold">Cloud Armor</text>
  <text x="175" y="205" font-size="11" fill="#1B3A8C" text-anchor="middle">guards traffic COMING IN</text>
  <text x="175" y="222" font-size="10" fill="#4285F4" text-anchor="middle">(this chapter)</text>
  <line x1="290" y1="195" x2="375" y2="195" stroke="#4285F4" stroke-width="2.5"/>
  <text x="330" y="140" font-size="12" fill="#4285F4" text-anchor="middle" font-weight="bold">FRONT DOOR</text>

  <!-- back door: VPC-SC -->
  <rect x="610" y="150" width="230" height="90" rx="14" fill="#FBEAF0" stroke="#F96167" stroke-width="2"/>
  <text x="725" y="185" font-size="14" fill="#B0293A" text-anchor="middle" font-weight="bold">VPC Service Controls</text>
  <text x="725" y="205" font-size="11" fill="#B0293A" text-anchor="middle">guards data going OUT</text>
  <text x="725" y="222" font-size="10" fill="#F96167" text-anchor="middle">(Chapter 1, §1.4.3)</text>
  <line x1="525" y1="195" x2="605" y2="195" stroke="#F96167" stroke-width="2.5"/>
  <text x="565" y="140" font-size="12" fill="#F96167" text-anchor="middle" font-weight="bold">BACK DOOR</text>

  <text x="450" y="310" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">
    Layered together, they cover both directions of the same underlying concern.
  </text>
</svg>
