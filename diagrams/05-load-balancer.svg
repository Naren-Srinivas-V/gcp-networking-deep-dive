<svg width="900" height="440" viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="440" fill="#FFFFFF"/>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#16224F" stroke-width="2"/>
    </marker>
  </defs>

  <text x="450" y="40" font-size="20" font-weight="bold" fill="#16224F" text-anchor="middle">HTTP(S) Load Balancer — global, content-aware</text>

  <!-- users -->
  <circle cx="150" cy="100" r="26" fill="#F4F6FB" stroke="#6B7280" stroke-width="2"/>
  <text x="150" y="106" font-size="11" text-anchor="middle" fill="#374151">User</text>
  <circle cx="450" cy="90" r="26" fill="#F4F6FB" stroke="#6B7280" stroke-width="2"/>
  <text x="450" y="96" font-size="11" text-anchor="middle" fill="#374151">User</text>
  <circle cx="750" cy="100" r="26" fill="#F4F6FB" stroke="#6B7280" stroke-width="2"/>
  <text x="750" y="106" font-size="11" text-anchor="middle" fill="#374151">User</text>

  <!-- LB -->
  <rect x="320" y="160" width="260" height="80" rx="16" fill="#16224F"/>
  <text x="450" y="195" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">HTTP(S) Load Balancer</text>
  <text x="450" y="215" font-size="11" fill="#CADCFC" text-anchor="middle">routes by nearest region + path</text>

  <line x1="150" y1="126" x2="380" y2="165" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <line x1="450" y1="116" x2="450" y2="155" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <line x1="750" y1="126" x2="520" y2="165" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <!-- backends -->
  <rect x="150" y="310" width="220" height="90" rx="14" fill="#4285F4"/>
  <text x="260" y="345" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Backend: asia-south1</text>
  <text x="260" y="365" font-size="11" fill="#E8F0FE" text-anchor="middle">/images/* traffic</text>

  <rect x="530" y="310" width="220" height="90" rx="14" fill="#00A896"/>
  <text x="640" y="345" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Backend: us-central1</text>
  <text x="640" y="365" font-size="11" fill="#FFFFFF" text-anchor="middle">/api/* traffic</text>

  <line x1="400" y1="240" x2="270" y2="305" stroke="#16224F" stroke-width="2" marker-end="url(#arrowB)"/>
  <line x1="500" y1="240" x2="630" y2="305" stroke="#16224F" stroke-width="2" marker-end="url(#arrowB)"/>
</svg>
