<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="480" fill="#FFFFFF"/>
  <!-- VPC container -->
  <rect x="30" y="30" width="840" height="380" rx="18" fill="#F4F6FB" stroke="#16224F" stroke-width="2.5"/>
  <text x="55" y="65" font-size="20" font-weight="bold" fill="#16224F">VPC: my-network (GLOBAL scope)</text>

  <!-- Subnet 1 -->
  <rect x="70" y="100" width="340" height="270" rx="14" fill="#E8F0FE" stroke="#4285F4" stroke-width="2"/>
  <text x="95" y="135" font-size="16" font-weight="bold" fill="#1B3A8C">Subnet: asia-south1</text>
  <text x="95" y="158" font-size="13" fill="#345" >10.0.1.0/24</text>
  <rect x="100" y="190" width="110" height="70" rx="10" fill="#4285F4"/>
  <text x="155" y="230" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">VM A</text>
  <rect x="250" y="190" width="110" height="70" rx="10" fill="#4285F4"/>
  <text x="305" y="230" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">VM B</text>
  <text x="95" y="335" font-size="12" fill="#556" >Region: asia-south1</text>

  <!-- Subnet 2 -->
  <rect x="490" y="100" width="340" height="270" rx="14" fill="#E1F5EE" stroke="#00A896" stroke-width="2"/>
  <text x="515" y="135" font-size="16" font-weight="bold" fill="#00695C">Subnet: us-central1</text>
  <text x="515" y="158" font-size="13" fill="#345">10.0.2.0/24</text>
  <rect x="520" y="190" width="110" height="70" rx="10" fill="#00A896"/>
  <text x="575" y="230" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">VM C</text>
  <rect x="670" y="190" width="110" height="70" rx="10" fill="#00A896"/>
  <text x="725" y="230" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">VM D</text>
  <text x="515" y="335" font-size="12" fill="#556">Region: us-central1</text>

  <!-- connecting line across subnets, same VPC -->
  <line x1="410" y1="225" x2="490" y2="225" stroke="#16224F" stroke-width="2.5" stroke-dasharray="6,5"/>
  <text x="450" y="205" font-size="9.5" fill="#16224F" text-anchor="middle">private,</text>
  <text x="450" y="252" font-size="9.5" fill="#16224F" text-anchor="middle">same VPC</text>

  <text x="450" y="440" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">
    One VPC spans every region at once — but each subnet belongs to exactly one region.
  </text>
</svg>
