<svg width="900" height="460" viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="460" fill="#FFFFFF"/>
  <defs>
    <marker id="arrowR2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#F96167" stroke-width="2"/>
    </marker>
    <marker id="arrowG2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#00A896" stroke-width="2"/>
    </marker>
  </defs>

  <!-- WITHOUT -->
  <text x="225" y="40" font-size="17" font-weight="bold" fill="#F96167" text-anchor="middle">WITHOUT Private Google Access</text>
  <rect x="60" y="70" width="150" height="70" rx="12" fill="#FBEAF0" stroke="#F96167" stroke-width="2"/>
  <text x="135" y="100" font-size="12" fill="#B0293A" text-anchor="middle" font-weight="bold">VM</text>
  <text x="135" y="118" font-size="10" fill="#B0293A" text-anchor="middle">external IP</text>

  <rect x="255" y="70" width="150" height="70" rx="12" fill="#F4F6FB" stroke="#6B7280" stroke-width="2"/>
  <text x="330" y="110" font-size="12" fill="#374151" text-anchor="middle" font-weight="bold">Public Internet</text>

  <rect x="60" y="180" width="345" height="55" rx="10" fill="#16224F"/>
  <text x="232" y="213" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Cloud Storage (public endpoint)</text>

  <line x1="135" y1="140" x2="135" y2="180" stroke="#F96167" stroke-width="2.5" marker-end="url(#arrowR2)"/>
  <line x1="330" y1="140" x2="330" y2="180" stroke="#F96167" stroke-width="2.5" marker-end="url(#arrowR2)"/>
  <text x="225" y="260" font-size="11" fill="#F96167" text-anchor="middle" font-style="italic">exposed to the open internet</text>

  <!-- divider -->
  <line x1="450" y1="20" x2="450" y2="420" stroke="#DDE3EF" stroke-width="2"/>

  <!-- WITH -->
  <text x="675" y="40" font-size="17" font-weight="bold" fill="#00A896" text-anchor="middle">WITH Private Google Access</text>
  <rect x="500" y="70" width="150" height="70" rx="12" fill="#E1F5EE" stroke="#00A896" stroke-width="2"/>
  <text x="575" y="100" font-size="12" fill="#00695C" text-anchor="middle" font-weight="bold">VM</text>
  <text x="575" y="118" font-size="10" fill="#00695C" text-anchor="middle">internal IP only</text>

  <rect x="695" y="70" width="150" height="70" rx="12" fill="#F4F6FB" stroke="#6B7280" stroke-width="2"/>
  <text x="770" y="100" font-size="11" fill="#374151" text-anchor="middle" font-weight="bold">Google's private</text>
  <text x="770" y="116" font-size="11" fill="#374151" text-anchor="middle" font-weight="bold">network</text>

  <rect x="500" y="180" width="345" height="55" rx="10" fill="#16224F"/>
  <text x="672" y="213" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Cloud Storage (private route)</text>

  <line x1="575" y1="140" x2="575" y2="180" stroke="#00A896" stroke-width="2.5" marker-end="url(#arrowG2)"/>
  <line x1="770" y1="140" x2="770" y2="180" stroke="#00A896" stroke-width="2.5" marker-end="url(#arrowG2)"/>
  <text x="672" y="260" font-size="11" fill="#00A896" text-anchor="middle" font-style="italic">never touches the public internet</text>

  <text x="450" y="330" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">
    Delivering on Chapter 3's promise — this is how Compute and Storage
  </text>
  <text x="450" y="352" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">
    talk privately, with no public internet hop involved.
  </text>
</svg>
