<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="360" fill="#FFFFFF"/>
  <defs>
    <marker id="arrowG3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#00A896" stroke-width="2.5"/>
    </marker>
    <marker id="arrowR3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#F96167" stroke-width="2.5"/>
    </marker>
  </defs>

  <text x="450" y="45" font-size="20" font-weight="bold" fill="#16224F" text-anchor="middle">Cloud NAT — a strict one-way door</text>

  <rect x="70" y="140" width="180" height="90" rx="14" fill="#4285F4"/>
  <text x="160" y="180" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">VM</text>
  <text x="160" y="200" font-size="11" fill="#E8F0FE" text-anchor="middle">internal IP only</text>

  <rect x="360" y="140" width="180" height="90" rx="14" fill="#16224F"/>
  <text x="450" y="190" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Cloud NAT</text>

  <rect x="650" y="140" width="180" height="90" rx="14" fill="#F4F6FB" stroke="#6B7280" stroke-width="2"/>
  <text x="740" y="190" font-size="14" fill="#374151" text-anchor="middle" font-weight="bold">Internet</text>

  <line x1="250" y1="170" x2="355" y2="170" stroke="#00A896" stroke-width="2.5" marker-end="url(#arrowG3)"/>
  <line x1="540" y1="170" x2="645" y2="170" stroke="#00A896" stroke-width="2.5" marker-end="url(#arrowG3)"/>
  <text x="450" y="130" font-size="12" fill="#00A896" text-anchor="middle" font-weight="bold">outbound: ALLOWED</text>

  <line x1="645" y1="215" x2="255" y2="215" stroke="#F96167" stroke-width="2.5" marker-end="url(#arrowR3)"/>
  <text x="450" y="255" font-size="12" fill="#F96167" text-anchor="middle" font-weight="bold">unsolicited inbound: BLOCKED</text>

  <text x="450" y="310" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">
    The VM can reach the internet to fetch updates — but is never directly reachable or scannable from it.
  </text>
</svg>
