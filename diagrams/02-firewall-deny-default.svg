<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#00A896" stroke-width="2"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#F96167" stroke-width="2"/>
    </marker>
  </defs>

  <text x="450" y="45" font-size="20" font-weight="bold" fill="#16224F" text-anchor="middle">Firewall: deny ingress by default</text>

  <!-- internet -->
  <rect x="60" y="150" width="160" height="90" rx="14" fill="#F4F6FB" stroke="#6B7280" stroke-width="2"/>
  <text x="140" y="200" font-size="15" fill="#374151" text-anchor="middle" font-weight="bold">Internet</text>

  <!-- checkpoint -->
  <rect x="330" y="120" width="220" height="150" rx="14" fill="#16224F"/>
  <text x="440" y="155" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Firewall</text>
  <text x="440" y="175" font-size="12" fill="#CADCFC" text-anchor="middle">checkpoint</text>
  <rect x="355" y="195" width="170" height="30" rx="7" fill="#F96167"/>
  <text x="440" y="215" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Ingress: DENY (default)</text>
  <rect x="355" y="232" width="170" height="30" rx="7" fill="#00A896"/>
  <text x="440" y="252" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Egress: ALLOW (default)</text>

  <!-- VM -->
  <rect x="670" y="150" width="170" height="90" rx="14" fill="#4285F4"/>
  <text x="755" y="200" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">VM</text>

  <!-- arrows -->
  <line x1="220" y1="175" x2="325" y2="175" stroke="#F96167" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <text x="272" y="160" font-size="11" fill="#F96167" text-anchor="middle">unsolicited traffic</text>

  <line x1="550" y1="175" x2="665" y2="175" stroke="#00A896" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <text x="607" y="160" font-size="11" fill="#00A896" text-anchor="middle">only if ALLOW rule</text>
  <text x="607" y="145" font-size="11" fill="#00A896" text-anchor="middle">matches</text>

  <text x="450" y="330" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">
    Same "deny by default" philosophy as Chapter 1's IAM and Chapter 2's Cloud Run —
  </text>
  <text x="450" y="352" font-size="14" fill="#6B7280" text-anchor="middle" font-style="italic">
    now enforced at the network layer, before any request reaches IAM at all.
  </text>
</svg>
